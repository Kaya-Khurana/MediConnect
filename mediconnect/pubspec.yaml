name: mediconnect
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0" # Updated for modern Flutter

# ---------------- DEPENDENCIES ----------------
# This section is for packages
dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.1
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  intl: ^0.18.1
  pdf: ^3.10.8 # For creating PDF documents
  printing: ^5.12.0 # For saving/sharing the PDF

# ---------------- DEV DEPENDENCIES ----------------
# This section is for testing/linting
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0 # Use 3.0.0 or higher

# ---------------- FLUTTER SETTINGS ----------------
# This section is for assets, fonts, etc.
flutter:
  uses-material-design: true

  # This is the correct location for your assets:
  assets:
    - assets/mediconnect_logo.png
